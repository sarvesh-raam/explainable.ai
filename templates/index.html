<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explainable AI for cardiac risk: an ensemble of machine-learning models with SHAP explanations in plain language." />
  <title>explainable.ai · Cardiac Risk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2310a37f%22/%3E%3Cpath d=%22M5 17h6l3-7 4 13 3-6h6%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <style>
    :root {
      --bg: #1c1c1e;
      --sidebar: #151516;
      --card: #2a2a2d;
      --card-2: #232325;
      --border: rgba(255,255,255,0.1);
      --accent: #10a37f;
      --accent-soft: rgba(16,163,127,0.12);
      --text: #ececec;
      --text-muted: #a8a8ad;
      --text-dim: #77777d;
      --up: #f87171;
      --down: #4ade80;
      --warn: #fbbf24;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    aside.sidebar {
      width: 260px; flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 0.8rem;
    }
    .new-chat {
      border: 1px solid var(--border); border-radius: var(--radius); background: none;
      padding: 0.75rem; display: flex; align-items: center; gap: 0.6rem;
      font-size: 0.85rem; font-weight: 500; cursor: pointer; margin-bottom: 1.5rem;
    }
    .new-chat:hover { background: rgba(255,255,255,0.05); }
    .side-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin: 0 0.5rem 0.5rem; }
    #historyList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .history-item {
      background: none; border: none; text-align: left; width: 100%;
      padding: 0.6rem 0.75rem; border-radius: 8px;
      font-size: 0.82rem; color: var(--text-muted); cursor: pointer;
      display: flex; justify-content: space-between; gap: 0.5rem;
    }
    .history-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .history-empty { font-size: 0.8rem; color: var(--text-dim); padding: 0.5rem 0.75rem; }
    .sidebar-footer { padding-top: 0.8rem; border-top: 1px solid var(--border); font-size: 0.72rem; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; }
    .link-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.72rem; text-decoration: underline; }
    .link-btn:hover { color: var(--text); }

    /* ── Main ────────────────────────────────────────────────────── */
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    header {
      padding: 0.9rem 1.25rem; display: flex; align-items: center; gap: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .branding { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
    .branding span { color: var(--accent); }
    .menu-btn { display: none; background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.2rem 0.4rem; }
    .progress { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.6rem; }
    .progress-bar { width: 120px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-bar > div { height: 100%; background: var(--accent); width: 0; transition: width 0.3s; }

    #chatViewport { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .chat-container { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; padding: 2rem 1rem 3rem; }

    .msg { display: flex; gap: 1rem; line-height: 1.6; animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 800; color: #fff;
    }
    .msg.system .avatar { background: var(--accent); }
    .msg.user .avatar { background: #5b46d6; }
    .msg-content {
      max-width: min(100%, 680px); min-width: 0;
      background: var(--card); border: 1px solid var(--border);
      padding: 0.7rem 1rem; border-radius: 12px; overflow-wrap: anywhere;
    }
    .msg.user .msg-content { background: #34343a; border-color: transparent; }
    .msg.wide .msg-content { max-width: 100%; flex: 1; }
    .muted { color: var(--text-muted); }
    .small { font-size: 0.82rem; }

    .help-btn {
      width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--accent); background: none;
      color: var(--accent); font-size: 0.7rem; margin-left: 0.4rem; cursor: pointer; vertical-align: middle;
    }
    .help-text { margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-muted); border-left: 2px solid var(--accent); padding-left: 0.6rem; }
    .hint { margin-top: 0.35rem; font-size: 0.78rem; color: var(--text-dim); }

    .options-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.8rem; }
    .opt-pill {
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      padding: 0.45rem 0.95rem; border-radius: 99px; font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
    }
    .opt-pill:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .opt-pill:disabled { opacity: 0.4; cursor: default; }
    .opt-pill.chosen { opacity: 1; border-color: var(--accent); color: var(--accent); }
    .opt-pill.primary { border-color: var(--accent); color: var(--accent); }
    .opt-pill.ghost { border-style: dashed; }

    .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--text-muted); animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; } .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    /* ── Composer ────────────────────────────────────────────────── */
    .input-wrapper { padding: 0.75rem 1rem 1rem; border-top: 1px solid var(--border); background: var(--bg); }
    .input-box {
      max-width: 820px; margin: 0 auto; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.6rem 0.75rem; display: flex; align-items: flex-end; gap: 0.6rem;
    }
    #userInput {
      flex: 1; background: transparent; border: none; color: var(--text); font: inherit; font-size: 1rem;
      outline: none; resize: none; min-height: 24px; max-height: 160px; line-height: 1.5;
    }
    #sendBtn {
      background: var(--accent); color: #fff; border: none; width: 34px; height: 34px; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.45; transition: opacity 0.2s;
    }
    #sendBtn.active { opacity: 1; }
    .composer-hint { max-width: 820px; margin: 0.4rem auto 0; font-size: 0.72rem; color: var(--text-dim); text-align: center; }

    /* ── Report ──────────────────────────────────────────────────── */
    .report { display: flex; flex-direction: column; gap: 1.25rem; }
    .report h4 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 0.6rem; }
    .section { background: var(--card-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .risk-head { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
    .risk-num { font-size: 3.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .band { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 99px; margin-bottom: 0.3rem; }
    .meter { position: relative; height: 8px; border-radius: 99px; margin-top: 1rem;
      background: linear-gradient(90deg, #4ade80 0%, #fbbf24 35%, #fb923c 62%, #f87171 100%); }
    .meter .marker { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: #fff; transform: translateX(-2px); box-shadow: 0 0 0 2px var(--bg); }
    .meter-scale { position: relative; height: 1rem; font-size: 0.68rem; color: var(--text-dim); margin-top: 0.3rem; }
    .meter-scale span { position: absolute; transform: translateX(-50%); }
    .meter-scale span:first-child { transform: none; } .meter-scale span:last-child { transform: translateX(-100%); }
    .models { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .model-card { border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem; text-align: center; }
    .model-card .n { font-size: 0.68rem; color: var(--text-muted); }
    .model-card .v { font-weight: 700; font-variant-numeric: tabular-nums; }

    .drivers { display: flex; flex-direction: column; gap: 0.35rem; }
    .driver { display: grid; grid-template-columns: minmax(110px, 34%) 1fr 52px; align-items: center; gap: 0.6rem; font-size: 0.8rem; }
    .driver .lbl { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .driver .lbl b { color: var(--text); font-weight: 500; }
    .track { position: relative; height: 14px; }
    .track::before { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--border); }
    .bar { position: absolute; top: 2px; height: 10px; border-radius: 3px; }
    .bar.up { left: 50%; background: var(--up); }
    .bar.down { right: 50%; background: var(--down); }
    .driver .num { text-align: right; font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
    .legend { display: flex; gap: 1rem; font-size: 0.72rem; color: var(--text-muted); margin-top: 0.7rem; flex-wrap: wrap; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 0.3rem; vertical-align: -1px; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    ul.clean { list-style: none; display: flex; flex-direction: column; gap: 0.45rem; font-size: 0.85rem; }
    ul.clean li { padding-left: 1rem; position: relative; color: var(--text-muted); }
    ul.clean li::before { content: ''; position: absolute; left: 0; top: 0.55em; width: 6px; height: 6px; border-radius: 50%; background: var(--dot, var(--accent)); }
    .warnbox { border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.06); font-size: 0.82rem; color: var(--warn); }
    .disclaimer { font-size: 0.75rem; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 0.8rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    details.raw summary { cursor: pointer; font-size: 0.78rem; color: var(--text-muted); }
    details.raw pre { margin-top: 0.6rem; max-height: 300px; overflow: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); white-space: pre-wrap; }

    /* ── Mobile ──────────────────────────────────────────────────── */
    .scrim { display: none; }
    @media (max-width: 860px) {
      aside.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 50; transform: translateX(-100%); transition: transform 0.25s; }
      body.nav-open aside.sidebar { transform: none; }
      body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
      .menu-btn { display: block; }
      .progress-bar { width: 70px; }
      .two-col { grid-template-columns: 1fr; }
      .msg { gap: 0.6rem; }
      .avatar { width: 26px; height: 26px; }
      .risk-num { font-size: 2.6rem; }
      .msg.wide .avatar { display: none; }
      .chat-container { padding: 1.25rem 0.75rem 2rem; }
      .driver { grid-template-columns: minmax(0, 46%) 1fr 40px; gap: 0.4rem; }
      .section { padding: 0.85rem; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="History">
    <button class="new-chat" id="newBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New analysis
    </button>
    <div class="side-label">Recent reports</div>
    <div id="historyList"></div>
    <div class="sidebar-footer">
      <span>Stored only in this browser</span>
      <button class="link-btn" id="clearHistory">Clear</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <header>
      <button class="menu-btn" id="menuBtn" aria-label="Open history">☰</button>
      <div class="branding">explainable.<span>ai</span></div>
      <div class="progress" id="progress" hidden>
        <span id="progressText"></span>
        <div class="progress-bar"><div id="progressFill"></div></div>
      </div>
    </header>

    <section id="chatViewport">
      <div class="chat-container" id="chatHistory" aria-live="polite"></div>
    </section>

    <div class="input-wrapper">
      <div class="input-box">
        <textarea id="userInput" placeholder="Type an answer or a question…" rows="1" aria-label="Message"></textarea>
        <button id="sendBtn" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
      <div class="composer-hint" id="composerHint">Research prototype — not a substitute for medical advice.</div>
    </div>
  </main>

<script>
  const SAMPLES = {
    'Low-risk sample': { age: 41, sex: 0, cp: 1, trestbps: 120, chol: 190, fbs: 0, restecg: 1, thalach: 172, exang: 0, oldpeak: 0, slope: 2, ca: 0, thal: 2 },
    'High-risk sample': { age: 63, sex: 1, cp: 0, trestbps: 150, chol: 280, fbs: 1, restecg: 0, thalach: 118, exang: 1, oldpeak: 2.6, slope: 1, ca: 2, thal: 3 },
  };
  const HISTORY_KEY = 'xai_history_v2';
  const BAND_COLORS = { 'Low': '#4ade80', 'Moderate': '#fbbf24', 'High': '#fb923c', 'Very high': '#f87171' };

  const state = { modules: {}, module: null, step: 0, answers: {}, phase: 'start', report: null, busy: false };
  const $ = id => document.getElementById(id);
  const chat = $('chatHistory'), viewport = $('chatViewport'), inputEl = $('userInput'), sendBtn = $('sendBtn');

  // ── Rendering helpers ────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>'); }
  function el(tag, attrs = {}, html = '') {
    const e = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => k === 'class' ? e.className = v : e.setAttribute(k, v));
    if (html) e.innerHTML = html;
    return e;
  }
  function scrollDown() { requestAnimationFrame(() => { viewport.scrollTop = viewport.scrollHeight; }); }

  function addMsg(role, content, { wide = false } = {}) {
    const div = el('div', { class: `msg ${role}${wide ? ' wide' : ''}` });
    div.appendChild(el('div', { class: 'avatar', 'aria-hidden': 'true' }, role === 'system' ? 'AI' : 'You'));
    const body = el('div', { class: 'msg-content' });
    if (content instanceof Node) body.appendChild(content); else body.innerHTML = md(content);
    div.appendChild(body);
    chat.appendChild(div);
    scrollDown();
    return body;
  }
  function addTyping() {
    const body = addMsg('system', '');
    body.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    return body.parentElement;
  }
  function pills(options, onPick) {
    const row = el('div', { class: 'options-row' });
    options.forEach(o => {
      const b = el('button', { class: 'opt-pill' + (o.cls ? ' ' + o.cls : '') });
      b.textContent = o.label;
      b.onclick = () => onPick(o, b, row);
      row.appendChild(b);
    });
    return row;
  }
  function lockRow(row, chosen) {
    row.querySelectorAll('button').forEach(b => { b.disabled = true; if (b === chosen) b.classList.add('chosen'); });
  }

  function setProgress() {
    const total = state.module ? state.module.features.length : 0;
    const show = state.phase === 'questions';
    $('progress').hidden = !show;
    if (show) {
      $('progressText').textContent = `${state.step + 1} / ${total}`;
      $('progressFill').style.width = `${(state.step / total) * 100}%`;
    }
  }
  function setHint(text) { $('composerHint').textContent = text || 'Research prototype — not a substitute for medical advice.'; }

  // ── Flow ─────────────────────────────────────────────────────────
  async function start() {
    Object.assign(state, { module: null, step: 0, answers: {}, phase: 'start', report: null, busy: false });
    chat.innerHTML = ''; setProgress(); setHint();
    try {
      const res = await fetch('/modules');
      state.modules = await res.json();
    } catch (e) {
      return addMsg('system', "I couldn't reach the server. Please check that the backend is running and reload.");
    }
    const mods = Object.values(state.modules);
    if (!mods.length) return addMsg('system', 'No analysis modules are available. Run `python train.py` on the server.');

    const intro = el('div');
    intro.innerHTML = md("Hello! I estimate the risk of **coronary heart disease** from 13 clinical measurements, then explain *why* " +
      "the models reached that result.\n\nAnswer the questions one by one, or load a sample patient to see a report straight away.");
    intro.appendChild(pills([
      ...mods.map(m => ({ label: `${m.icon} Start ${m.name} assessment`, cls: 'primary', mod: m.id })),
      ...Object.keys(SAMPLES).map(k => ({ label: k, cls: 'ghost', sample: k, mod: mods[0].id })),
    ], (o, b, row) => {
      lockRow(row, b);
      state.module = state.modules[o.mod];
      if (o.sample) {
        addMsg('user', o.label);
        state.answers = { ...SAMPLES[o.sample] };
        state.step = state.module.features.length;
        submit();
      } else {
        addMsg('user', o.label.replace(/^\S+\s/, ''));
        state.phase = 'questions';
        setTimeout(ask, 250);
      }
    }));
    addMsg('system', intro);
  }

  function ask() {
    const f = state.module.features[state.step];
    setProgress();
    const wrap = el('div');
    wrap.innerHTML = esc(f.q);
    const help = el('button', { class: 'help-btn', 'aria-label': 'What is this?', title: 'What is this?' }, '?');
    const helpText = el('div', { class: 'help-text', hidden: '' }); helpText.textContent = f.help;
    help.onclick = () => { helpText.hidden = !helpText.hidden; };
    wrap.appendChild(help); wrap.appendChild(helpText);

    const stepAtAsk = state.step;
    const opts = f.type === 'select' ? f.opts.map(o => ({ label: o.l, value: o.v })) : [];
    if (stepAtAsk > 0) opts.push({ label: '← Back', back: true, cls: 'ghost' });
    if (f.type === 'number') {
      wrap.appendChild(el('div', { class: 'hint' }, esc(`Type a number between ${f.min} and ${f.max} ${f.unit}.`)));
    }
    if (opts.length) {
      wrap.appendChild(pills(opts, (o, b, row) => {
        if (state.step !== stepAtAsk || state.busy) return;
        lockRow(row, b);
        if (o.back) return goBack();
        answer(o.value, o.label);
      }));
    }
    addMsg('system', wrap);
    setHint(f.type === 'number' ? `${f.label}: ${f.min}–${f.max} ${f.unit}` : `Choose an option or type it, e.g. "${f.opts[0].l}"`);
    inputEl.focus();
  }

  function answer(value, label, echo = true) {
    const f = state.module.features[state.step];
    state.answers[f.id] = value;
    if (echo) addMsg('user', label);
    disableOpenQuestions();
    state.step++;
    if (state.step < state.module.features.length) setTimeout(ask, 250);
    else submit();
  }

  function goBack() {
    disableOpenQuestions();
    addMsg('user', '← Back');
    state.step = Math.max(0, state.step - 1);
    delete state.answers[state.module.features[state.step].id];
    setTimeout(ask, 150);
  }

  function disableOpenQuestions() {
    chat.querySelectorAll('.options-row button:not(:disabled)').forEach(b => { b.disabled = true; });
  }

  function handleTypedAnswer(text) {
    const f = state.module.features[state.step];
    if (/^(back|undo)$/i.test(text) && state.step > 0) return goBack();
    if (f.type === 'number') {
      const n = Number(text.replace(',', '.'));
      if (!Number.isFinite(n) || text === '') return addMsg('system', `Please enter a number for **${f.label}** (${f.unit}).`);
      if (n < f.min || n > f.max) return addMsg('system', `**${f.label}** should be between ${f.min} and ${f.max} ${f.unit}. Please check the value.`);
      return answer(n, `${n} ${f.unit}`, false);
    }
    const t = text.toLowerCase();
    const match = f.opts.find(o => o.l.toLowerCase() === t || String(o.v) === t) ||
                  f.opts.find(o => o.l.toLowerCase().startsWith(t));
    if (!match) return addMsg('system', `Please choose one of: ${f.opts.map(o => `**${o.l}**`).join(', ')}.`);
    answer(match.v, match.l, false);
  }

  async function submit() {
    state.phase = 'loading'; state.busy = true; setProgress(); setHint('Generating report…');
    const typing = addTyping();
    try {
      const res = await fetch(`/predict/${state.module.id}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state.answers),
      });
      const data = await res.json();
      typing.remove();
      if (!data.success) {
        const fields = data.fields ? '\n' + Object.values(data.fields).map(e => `• ${e}`).join('\n') : '';
        addMsg('system', `Sorry, I couldn't generate the report: ${data.error}${fields}`);
        return restartPrompt();
      }
      state.report = data;
      state.phase = 'report';
      renderReport(data);
      saveHistory(data);
    } catch (e) {
      typing.remove();
      addMsg('system', 'The connection was interrupted. Please try again.');
      restartPrompt();
    } finally {
      state.busy = false; setHint();
    }
  }

  function restartPrompt() {
    state.phase = 'start';
    const w = el('div'); w.textContent = 'Would you like to start again?';
    w.appendChild(pills([{ label: 'New analysis', cls: 'primary' }], () => start()));
    addMsg('system', w);
  }

  // ── Report ───────────────────────────────────────────────────────
  function renderReport(d) {
    const color = BAND_COLORS[d.band] || 'var(--text)';
    const exp = d.explanation;
    const maxAbs = Math.max(...exp.drivers.map(x => Math.abs(x.impact)), 1);
    const driverRow = x => {
      const w = (Math.abs(x.impact) / maxAbs) * 50;
      return `<div class="driver" title="${esc(x.description)}">
        <div class="lbl"><b>${esc(x.label)}</b></div>
        <div class="track"><div class="bar ${x.impact > 0 ? 'up' : 'down'}" style="width:${w}%"></div></div>
        <div class="num" style="color:${x.impact > 0 ? 'var(--up)' : 'var(--down)'}">${x.impact > 0 ? '+' : ''}${x.impact.toFixed(1)}</div>
      </div>`;
    };
    const up = exp.drivers.filter(x => x.impact > 0).slice(0, 3);
    const down = exp.drivers.filter(x => x.impact < 0).slice(0, 3);
    const li = (x, dot) => `<li style="--dot:${dot}"><strong style="color:var(--text)">${esc(x.label)}</strong> — ${esc(x.description)}</li>`;
    const models = Object.values(d.predictions);
    const spread = Math.max(...models.map(m => m.risk)) - Math.min(...models.map(m => m.risk));

    const r = el('div', { class: 'report', id: 'report-' + Date.now() });
    r.innerHTML = `
      <div>
        <div class="risk-head">
          <div class="risk-num" style="color:${color}">${d.risk.toFixed(0)}%</div>
          <div>
            <span class="band" style="background:${color}22;color:${color}">${esc(d.band)} risk</span>
            <div class="small muted">Estimated probability of coronary heart disease<br>(average of ${models.length} models)</div>
          </div>
        </div>
        <div class="meter"><div class="marker" style="left:${d.risk}%"></div></div>
        <div class="meter-scale">${[0, 20, 50, 75, 100].map(v => `<span style="left:${v}%">${v}${v % 100 ? '' : '%'}</span>`).join('')}</div>
      </div>

      ${d.warnings.length ? `<div class="section warnbox">${d.warnings.map(esc).join('<br>')}</div>` : ''}

      <div class="section">
        <h4>Model agreement</h4>
        <div class="models">${models.map(m => `<div class="model-card"><div class="n">${esc(m.name)}</div>
          <div class="v" style="color:${BAND_COLORS[m.risk < 20 ? 'Low' : m.risk < 50 ? 'Moderate' : m.risk < 75 ? 'High' : 'Very high']}">${m.risk}%</div></div>`).join('')}</div>
        <div class="small muted" style="margin-top:0.6rem">${spread < 15 ? 'The models broadly agree.' : 'The models disagree by ' + spread.toFixed(0) + ' points — treat this estimate with extra caution.'}</div>
      </div>

      <div class="section">
        <h4>What drove this estimate</h4>
        <div class="small muted" style="margin-bottom:0.8rem">Starting from the average risk of <strong>${exp.base_risk}%</strong>,
          each factor pushed the ${esc(exp.model)} estimate up or down by the shown number of percentage points (SHAP values).</div>
        <div class="drivers">${exp.drivers.slice(0, 8).map(driverRow).join('')}</div>
        ${exp.drivers.length > 8 ? `<details style="margin-top:0.4rem"><summary class="small muted" style="cursor:pointer">Show all ${exp.drivers.length} factors</summary>
          <div class="drivers" style="margin-top:0.35rem">${exp.drivers.slice(8).map(driverRow).join('')}</div></details>` : ''}
        <div class="legend"><span><i style="background:var(--up)"></i>Raises risk</span><span><i style="background:var(--down)"></i>Lowers risk</span></div>
      </div>

      <div class="two-col">
        <div class="section"><h4>Raising the risk</h4>${up.length ? `<ul class="clean">${up.map(x => li(x, 'var(--up)')).join('')}</ul>` : '<div class="small muted">Nothing notable.</div>'}</div>
        <div class="section"><h4>Lowering the risk</h4>${down.length ? `<ul class="clean">${down.map(x => li(x, 'var(--down)')).join('')}</ul>` : '<div class="small muted">Nothing notable.</div>'}</div>
      </div>

      ${d.what_if.length ? `<div class="section"><h4>What if?</h4><ul class="clean">${d.what_if.map(w =>
        `<li>With ${esc(w.change)}: <strong style="color:var(--text)">${w.risk}%</strong> (${w.delta > 0 ? '+' : ''}${w.delta} pts)</li>`).join('')}</ul>
        <div class="small muted" style="margin-top:0.5rem">Model estimates only; they reflect associations in a small dataset, not proven effects of treatment.</div></div>` : ''}

      ${d.recommendations.length ? `<div class="section"><h4>Suggested next steps</h4><ul class="clean">${d.recommendations.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}

      <div class="actions"></div>
      <details class="raw"><summary>Show raw response (JSON)</summary><pre></pre></details>
      <div class="disclaimer">${esc(d.disclaimer)} Test-set performance of the ensemble: ROC-AUC ${d.metrics.roc_auc ?? '—'}, accuracy ${d.metrics.accuracy ?? '—'}.</div>`;
    r.querySelector('details.raw pre').textContent = JSON.stringify(d, null, 2);
    r.querySelector('.actions').appendChild(pills([
      { label: 'Download PDF ↓', cls: 'primary', act: 'pdf' },
      { label: 'New analysis', act: 'new' },
    ], o => o.act === 'pdf' ? downloadPDF(d) : start()));
    addMsg('system', r, { wide: true });

    const follow = el('div');
    follow.textContent = 'You can now ask me about this result.';
    follow.appendChild(pills(['Why this result?', 'What could lower the risk?', 'Do the models agree?', 'How accurate is this?']
      .map(label => ({ label })), o => sendChat(o.label)));
    addMsg('system', follow);
    setHint('Ask a question about the report');
  }

  async function sendChat(text) {
    if (state.busy) return;
    addMsg('user', text);
    state.busy = true;
    const typing = addTyping();
    try {
      const res = await fetch('/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, report: state.report }),
      });
      const data = await res.json();
      typing.remove();
      addMsg('system', data.reply || "I couldn't answer that.");
    } catch (e) {
      typing.remove();
      addMsg('system', 'Connection lost. Please try again.');
    } finally { state.busy = false; }
  }

  // ── PDF export ───────────────────────────────────────────────────
  function downloadPDF(d) {
    if (!window.jspdf) return addMsg('system', 'The PDF library has not loaded yet. Please try again in a moment.');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const W = 210, M = 18, CW = W - 2 * M;
    let y = 0;
    const ensure = h => { if (y + h > 280) { pdf.addPage(); y = 20; } };
    const para = (text, size = 9.5, color = [60, 60, 60]) => {
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(size); pdf.setTextColor(...color);
      pdf.splitTextToSize(text, CW).forEach(line => { ensure(5); pdf.text(line, M, y); y += size * 0.45; });
    };
    const heading = t => { y += 4; ensure(10); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11); pdf.setTextColor(16, 130, 100); pdf.text(t.toUpperCase(), M, y); y += 6; };

    pdf.setFillColor(16, 163, 127); pdf.rect(0, 0, W, 30, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(20); pdf.setTextColor(255, 255, 255);
    pdf.text('explainable.ai', M, 15);
    pdf.setFontSize(9); pdf.text(`CARDIAC RISK REPORT  ·  ${new Date().toLocaleString()}`, M, 23);

    y = 46;
    pdf.setFontSize(30); pdf.setTextColor(33, 33, 33); pdf.text(`${d.risk.toFixed(0)}%`, M, y);
    pdf.setFontSize(12); pdf.text(`${d.band} risk`, M + 34, y - 7);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9); pdf.setTextColor(90, 90, 90);
    pdf.text('Estimated probability of coronary heart disease (ensemble average)', M + 34, y - 1);
    y += 8;
    para('Models: ' + Object.values(d.predictions).map(m => `${m.name} ${m.risk}%`).join('   ·   '));

    heading('What drove this estimate (SHAP, percentage points)');
    const maxAbs = Math.max(...d.explanation.drivers.map(x => Math.abs(x.impact)), 1);
    const mid = M + 75, half = 55;
    d.explanation.drivers.forEach(x => {
      ensure(6);
      pdf.setFontSize(8.5); pdf.setTextColor(60, 60, 60); pdf.text(x.label, M, y);
      const w = (Math.abs(x.impact) / maxAbs) * half;
      if (x.impact > 0) { pdf.setFillColor(220, 80, 80); pdf.rect(mid, y - 3, w, 3.5, 'F'); }
      else { pdf.setFillColor(40, 170, 100); pdf.rect(mid - w, y - 3, w, 3.5, 'F'); }
      pdf.text(`${x.impact > 0 ? '+' : ''}${x.impact.toFixed(1)}`, mid + half + 4, y);
      y += 5.5;
    });
    pdf.setDrawColor(180); pdf.line(mid, y - 5.5 * d.explanation.drivers.length - 4, mid, y - 3);
    para(`Baseline (average) risk: ${d.explanation.base_risk}%. Explanation model: ${d.explanation.model}.`, 8.5, [110, 110, 110]);

    heading('Patient factors');
    d.explanation.drivers.forEach(x => para(`${x.impact > 0 ? '(+)' : '(-)'} ${x.label}: ${x.description}`));

    if (d.what_if.length) { heading('What if'); d.what_if.forEach(w => para(`• With ${w.change}: ${w.risk}% (${w.delta > 0 ? '+' : ''}${w.delta} pts)`)); }
    if (d.recommendations.length) { heading('Suggested next steps'); d.recommendations.forEach(t => para('• ' + t)); }
    if (d.warnings.length) { heading('Warnings'); d.warnings.forEach(t => para('• ' + t)); }
    y += 4; para(d.disclaimer, 8, [130, 130, 130]);
    pdf.save(`cardiac-risk-report-${new Date().toISOString().slice(0, 10)}.pdf`);
  }

  // ── History (browser-local) ──────────────────────────────────────
  function readHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) { return []; } }
  function writeHistory(h) { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch (e) { /* storage unavailable */ } }
  function saveHistory(d) {
    const h = readHistory();
    h.unshift({ id: Date.now(), ts: new Date().toISOString(), report: d });
    writeHistory(h.slice(0, 15));
    renderHistory();
  }
  function renderHistory() {
    const list = $('historyList'); list.innerHTML = '';
    const h = readHistory();
    if (!h.length) { list.innerHTML = '<div class="history-empty">No reports yet.</div>'; return; }
    h.forEach(item => {
      const b = el('button', { class: 'history-item' });
      const when = new Date(item.ts);
      b.innerHTML = `<span>${esc(when.toLocaleDateString())} ${esc(when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}</span>
        <span style="color:${BAND_COLORS[item.report.band]}">${esc(item.report.risk.toFixed(0))}%</span>`;
      b.onclick = () => openHistory(item);
      list.appendChild(b);
    });
  }
  function openHistory(item) {
    document.body.classList.remove('nav-open');
    chat.innerHTML = '';
    state.module = state.modules[item.report.module] || state.module;
    state.report = item.report; state.phase = 'report'; setProgress();
    addMsg('system', `Saved report from **${new Date(item.ts).toLocaleString()}**.`);
    renderReport(item.report);
  }

  // ── Input wiring ─────────────────────────────────────────────────
  function autosize() { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px'; }
  inputEl.addEventListener('input', () => { sendBtn.classList.toggle('active', inputEl.value.trim() !== ''); autosize(); });
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  sendBtn.onclick = send;
  function send() {
    const text = inputEl.value.trim();
    if (!text || state.busy) return;
    inputEl.value = ''; autosize(); sendBtn.classList.remove('active');
    if (state.phase === 'questions') { addMsg('user', text); handleTypedAnswer(text); }
    else if (state.phase === 'report') sendChat(text);
    else { addMsg('user', text); addMsg('system', 'Please choose an option above to begin.'); }
  }
  $('newBtn').onclick = () => { document.body.classList.remove('nav-open'); start(); };
  $('clearHistory').onclick = () => { writeHistory([]); renderHistory(); };
  $('menuBtn').onclick = () => document.body.classList.add('nav-open');
  $('scrim').onclick = () => document.body.classList.remove('nav-open');

  renderHistory();
  start();
</script>
</body>
</html>
